<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="590" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="590" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">ET KONKRET EKSEMPEL</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Hvad er en handel værd?</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Phil Foden ud og Bryan Mbeumo ind før runde 8. Tusind kroner over resten af sæsonen.</text><line x1="610.0" y1="200" x2="610.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="610.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">0</text><line x1="770.0" y1="200" x2="770.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="770.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">200</text><line x1="930.0" y1="200" x2="930.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="930.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">400</text><line x1="1090.0" y1="200" x2="1090.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="1090.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">600</text><text x="64" y="238" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Mbeumo forventes at give mere end Foden</text><path d="M610.0 214.0 H1122.0 Q1126.0 214.0 1126.0 218.0 V244.0 Q1126.0 248.0 1122.0 248.0 H610.0 Z" fill="#6aa50f"/><text x="1140.0" y="239" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">+645</text><text x="64" y="308" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Gebyr: 1 % af Mbeumos pris (7,2 mio.)</text><line x1="1126.0" y1="250" x2="1126.0" y2="284" stroke="#8fb8a6" stroke-width="1"/><path d="M1126.0 284.0 H1126.0 V318.0 H1072.4 Q1068.4 318.0 1068.4 314.0 V288.0 Q1068.4 284.0 1072.4 284.0 Z" fill="#d6409f"/><text x="1140.0" y="309" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">−72</text><text x="64" y="378" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Tabt rente: 0,88 mio. mere i spillere</text><line x1="1068.4" y1="320" x2="1068.4" y2="354" stroke="#8fb8a6" stroke-width="1"/><path d="M1068.4 354.0 H1068.4 V388.0 H980.4 Q976.4 388.0 976.4 384.0 V358.0 Q976.4 354.0 980.4 354.0 Z" fill="#d6409f"/><text x="1082.4" y="379" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">−114</text><text x="64" y="448" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Tilbage til dig</text><line x1="976.4" y1="390" x2="976.4" y2="424" stroke="#8fb8a6" stroke-width="1"/><path d="M610.0 424.0 H972.4 Q976.4 424.0 976.4 428.0 V454.0 Q976.4 458.0 972.4 458.0 H610.0 Z" fill="#6aa50f"/><text x="990.4000000000001" y="449" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">+458</text><text x="64" y="560" font-size="19" fill="#8fb8a6" font-weight="400" text-anchor="start">Rente regnes som 1 % pr. runde i 13 runder af de penge, der nu står i spillere og ikke i banken.</text>
