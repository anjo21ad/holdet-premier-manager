<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" role="img" aria-label="Clarke ud og Neto ind: +620 i forventet vækst, minus 48 i gebyr og 62 i tabt rente, giver +510 tusind kroner.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="590" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="590" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">ET KONKRET EKSEMPEL</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Hvad er en handel værd?</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Jack Clarke ud og Pedro Neto ind før runde 8. Tusind kroner over resten af sæsonen.</text><line x1="610.0" y1="200" x2="610.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="610.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">0</text><line x1="770.0" y1="200" x2="770.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="770.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">200</text><line x1="930.0" y1="200" x2="930.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="930.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">400</text><line x1="1090.0" y1="200" x2="1090.0" y2="490" stroke="#1f5240" stroke-width="1"/><text x="1090.0" y="516" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">600</text><text x="64" y="238" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Neto forventes at give mere end Clarke</text><path d="M610.0 214.0 H1102.0 Q1106.0 214.0 1106.0 218.0 V244.0 Q1106.0 248.0 1102.0 248.0 H610.0 Z" fill="#6aa50f"/><text x="1120.0" y="239" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">+620</text><text x="64" y="308" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Gebyr: 1 % af Netos pris (4,8 mio.)</text><line x1="1106.0" y1="250" x2="1106.0" y2="284" stroke="#8fb8a6" stroke-width="1"/><path d="M1106.0 284.0 H1106.0 V318.0 H1071.6 Q1067.6 318.0 1067.6 314.0 V288.0 Q1067.6 284.0 1071.6 284.0 Z" fill="#d6409f"/><text x="1120.0" y="309" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">−48</text><text x="64" y="378" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Tabt rente: 0,48 mio. mere i spillere</text><line x1="1067.6" y1="320" x2="1067.6" y2="354" stroke="#8fb8a6" stroke-width="1"/><path d="M1067.6 354.0 H1067.6 V388.0 H1022.0 Q1018.0 388.0 1018.0 384.0 V358.0 Q1018.0 354.0 1022.0 354.0 Z" fill="#d6409f"/><text x="1081.6" y="379" font-size="22" fill="#ffffff" font-weight="400" text-anchor="start">−62</text><text x="64" y="448" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Tilbage til dig</text><line x1="1018.0" y1="390" x2="1018.0" y2="424" stroke="#8fb8a6" stroke-width="1"/><path d="M610.0 424.0 H1014.0 Q1018.0 424.0 1018.0 428.0 V454.0 Q1018.0 458.0 1014.0 458.0 H610.0 Z" fill="#6aa50f"/><text x="1032.0" y="449" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">+510</text><text x="64" y="560" font-size="19" fill="#8fb8a6" font-weight="400" text-anchor="start">Rente regnes som 1 % pr. runde i 13 runder af de penge, der nu står i spillere og ikke i banken.</text>
</g></svg>
