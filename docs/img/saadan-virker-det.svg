<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-label="Fra data til beslutning: holdet.dk, understat, Betfair Match Odds og RotoWire går ind i modellen, derefter kvalitetstjek, seks spørgsmål og beslutning.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="530" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="530" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">SÅDAN VIRKER DET</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Fra data til beslutning</text><rect x="64" y="164" width="236" height="62" rx="12" fill="#134d39"/><text x="84" y="191" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">holdet.dk</text><text x="84" y="214" font-size="17" fill="#d1fae5" font-weight="400" text-anchor="start">Priser og klubber</text><path d="M300 195 C 322 195, 322 306.0, 346 306.0" fill="none" stroke="#8fb8a6" stroke-width="2"/><rect x="64" y="238" width="236" height="62" rx="12" fill="#134d39"/><text x="84" y="265" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">understat</text><text x="84" y="288" font-size="17" fill="#d1fae5" font-weight="400" text-anchor="start">Minutter og xG</text><path d="M300 269 C 322 269, 322 306.0, 346 306.0" fill="none" stroke="#8fb8a6" stroke-width="2"/><rect x="64" y="312" width="236" height="62" rx="12" fill="#134d39"/><text x="84" y="339" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">Betfair</text><text x="84" y="362" font-size="17" fill="#d1fae5" font-weight="400" text-anchor="start">Match Odds</text><path d="M300 343 C 322 343, 322 306.0, 346 306.0" fill="none" stroke="#8fb8a6" stroke-width="2"/><rect x="64" y="386" width="236" height="62" rx="12" fill="#134d39"/><text x="84" y="413" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">RotoWire</text><text x="84" y="436" font-size="17" fill="#d1fae5" font-weight="400" text-anchor="start">Opstillinger</text><path d="M300 417 C 322 417, 322 306.0, 346 306.0" fill="none" stroke="#8fb8a6" stroke-width="2"/><rect x="352" y="242.0" width="180" height="128" rx="14" fill="#134d39"/><text x="442" y="286.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Modellen</text><text x="442" y="320.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">Et tal for</text><text x="442" y="344.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">hver spiller</text><line x1="536" y1="306.0" x2="580" y2="306.0" stroke="#8fb8a6" stroke-width="2" marker-end="url(#pil)"/><rect x="584" y="242.0" width="180" height="128" rx="14" fill="#134d39"/><text x="674" y="286.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Kvalitetstjek</text><text x="674" y="320.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">Stopper ved</text><text x="674" y="344.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">fejl i data</text><line x1="768" y1="306.0" x2="812" y2="306.0" stroke="#8fb8a6" stroke-width="2" marker-end="url(#pil)"/><rect x="816" y="242.0" width="180" height="128" rx="14" fill="#134d39"/><text x="906" y="286.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Seks spørgsmål</text><text x="906" y="320.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">Holder</text><text x="906" y="344.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">handlen?</text><line x1="1000" y1="306.0" x2="1044" y2="306.0" stroke="#8fb8a6" stroke-width="2" marker-end="url(#pil)"/><rect x="1048" y="242.0" width="180" height="128" rx="14" fill="#134d39" stroke="#a3e635" stroke-width="2"/><text x="1138" y="286.0" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">Beslutning</text><text x="1138" y="320.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">Køb, sælg</text><text x="1138" y="344.0" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="middle">eller behold</text><path d="M1138 374.0 V440.0 H442 V378.0" fill="none" stroke="#8fb8a6" stroke-width="2" marker-end="url(#pil)"/><text x="790" y="474.0" font-size="19" fill="#d1fae5" font-weight="400" text-anchor="middle">Efter runden: blev det, som modellen sagde? Den ændres kun, hvis det beviseligt hjælper.</text>
</g></svg>
