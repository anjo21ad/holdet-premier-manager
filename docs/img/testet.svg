<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 502" width="1280" height="502" role="img" aria-label="Bygget og testet i virkeligheden: holdet bag projektet er nr. 69 af over 28.000 hold efter 7 runder. Cirka 590 spillere vurderes før hver deadline, 808 spiller-runder i backtest, 90-97 procent kroneeksakt pointberegning og seks kontroller pr. handel.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="502" rx="18"/></clipPath></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="502" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">BYGGET OG TESTET I VIRKELIGHEDEN</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Udviklet runde for runde i Premier Manager Efterår 2026</text><rect x="64" y="152" width="1152" height="122" rx="14" fill="#134d39" stroke="#a3e635" stroke-width="2"/><text x="96" y="236" font-size="64" fill="#ffffff" font-weight="700" text-anchor="start">Nr. 69</text><text x="336" y="202" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start">af over 28.000 hold efter 7 runder</text><text x="336" y="242" font-size="20" fill="#d1fae5" font-weight="400" text-anchor="start">Holdet bag projektet bruger modellen som beslutningsgrundlag i hver runde.</text><rect x="64" y="292" width="275" height="170" rx="14" fill="#134d39"/><text x="88" y="368" font-size="52" fill="#ffffff" font-weight="700" text-anchor="start">~590</text><text x="88" y="408" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">spillere vurderes</text><text x="88" y="434" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">før hver deadline</text><rect x="357" y="292" width="275" height="170" rx="14" fill="#134d39"/><text x="381" y="368" font-size="52" fill="#ffffff" font-weight="700" text-anchor="start">808</text><text x="381" y="408" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">spiller-runder i</text><text x="381" y="434" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">backtesten af modellen</text><rect x="650" y="292" width="275" height="170" rx="14" fill="#134d39"/><text x="674" y="368" font-size="52" fill="#ffffff" font-weight="700" text-anchor="start">90-97 %</text><text x="674" y="408" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">af spillernes point regnes</text><text x="674" y="434" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">kroneeksakt som holdet.dk</text><rect x="943" y="292" width="275" height="170" rx="14" fill="#134d39"/><text x="967" y="368" font-size="52" fill="#ffffff" font-weight="700" text-anchor="start">6</text><text x="967" y="408" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">kontroller, før en</text><text x="967" y="434" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">handel anbefales</text>
</g></svg>
