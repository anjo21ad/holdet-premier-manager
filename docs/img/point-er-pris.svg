<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Point er pris: en midtbanespiller, der scorer det første mål i en 2-0-udesejr, stiger 262.000 kr. i værdi.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="640" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="640" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">SPILLET PÅ ET HALVT MINUT</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Point er det samme som pris</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Eksempel: en midtbanespiller i en 2-0-udesejr, hvor han scorer det første mål.</text><text x="64" y="239" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">På banen</text><path d="M452.0 222.0 H455.9 Q459.7 222.0 459.7 225.8 V240.2 Q459.7 244.0 455.9 244.0 H452.0 Z" fill="#6aa50f"/><text x="471.7" y="240" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+7.000</text><text x="64" y="283" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejr</text><path d="M452.0 266.0 H475.5 Q479.5 266.0 479.5 270.0 V284.0 Q479.5 288.0 475.5 288.0 H452.0 Z" fill="#6aa50f"/><text x="491.5" y="284" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+25.000</text><text x="64" y="327" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejr på udebane</text><path d="M452.0 310.0 H459.0 Q463.0 310.0 463.0 314.0 V328.0 Q463.0 332.0 459.0 332.0 H452.0 Z" fill="#6aa50f"/><text x="475.0" y="328" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+10.000</text><text x="64" y="371" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">To holdmål, mens han er på banen</text><path d="M452.0 354.0 H470.0 Q474.0 354.0 474.0 358.0 V372.0 Q474.0 376.0 470.0 376.0 H452.0 Z" fill="#6aa50f"/><text x="486.0" y="372" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+20.000</text><text x="64" y="415" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Mål af en midtbanespiller</text><path d="M452.0 398.0 H613.0 Q617.0 398.0 617.0 402.0 V416.0 Q617.0 420.0 613.0 420.0 H452.0 Z" fill="#6aa50f"/><text x="629.0" y="416" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+150.000</text><text x="64" y="459" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejrsmål</text><path d="M452.0 442.0 H492.0 Q496.0 442.0 496.0 446.0 V460.0 Q496.0 464.0 492.0 464.0 H452.0 Z" fill="#6aa50f"/><text x="508.0" y="460" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+40.000</text><text x="64" y="503" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Et skud på mål mere</text><path d="M452.0 486.0 H459.0 Q463.0 486.0 463.0 490.0 V504.0 Q463.0 508.0 459.0 508.0 H452.0 Z" fill="#6aa50f"/><text x="475.0" y="504" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+10.000</text><line x1="64" y1="524" x2="800" y2="524" stroke="#1f5240" stroke-width="1"/><text x="64" y="564" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start">I alt</text><path d="M452.0 546.0 H736.2 Q740.2 546.0 740.2 550.0 V566.0 Q740.2 570.0 736.2 570.0 H452.0 Z" fill="#6aa50f"/><text x="752.2" y="565" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">+262.000 kr.</text><rect x="852" y="200" width="364" height="170" rx="14" fill="#134d39"/><text x="880" y="238" font-size="18" fill="#8fb8a6" font-weight="400" text-anchor="start">Spillerens pris</text><text x="880" y="280" font-size="28" fill="#d1fae5" font-weight="400" text-anchor="start">6,000</text><text x="972" y="280" font-size="28" fill="#8fb8a6" font-weight="400" text-anchor="start">→</text><text x="1016" y="280" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start">6,262 mio.</text><text x="880" y="320" font-size="20" fill="#d1fae5" font-weight="400" text-anchor="start">Dit hold er 262.000 kr.</text><text x="880" y="348" font-size="20" fill="#d1fae5" font-weight="400" text-anchor="start">mere værd efter kampen.</text><rect x="852" y="392" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="431" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Kaptajn</text><text x="1000" y="431" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">tæller dobbelt</text><rect x="852" y="466" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="505" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Bank</text><text x="1000" y="505" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">1 % rente pr. runde</text><rect x="852" y="540" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="579" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Køb</text><text x="1000" y="579" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">koster 1 % i gebyr</text>
</g></svg>
