<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Point er pris: scorer Bruno Fernandes det første mål i en 2-0-udesejr, stiger hans pris 262.000 kr.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="640" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="640" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">SPILLET PÅ ET HALVT MINUT</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Point er det samme som pris</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Tænkt eksempel: Bruno Fernandes scorer det første mål, da United vinder 2-0 på udebane.</text><text x="64" y="239" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">På banen</text><path d="M452.0 222.0 H455.5 Q459.0 222.0 459.0 225.5 V240.5 Q459.0 244.0 455.5 244.0 H452.0 Z" fill="#6aa50f"/><text x="471.0" y="240" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+7.000</text><text x="64" y="283" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejr</text><path d="M452.0 266.0 H473.0 Q477.0 266.0 477.0 270.0 V284.0 Q477.0 288.0 473.0 288.0 H452.0 Z" fill="#6aa50f"/><text x="489.0" y="284" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+25.000</text><text x="64" y="327" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejr på udebane</text><path d="M452.0 310.0 H458.0 Q462.0 310.0 462.0 314.0 V328.0 Q462.0 332.0 458.0 332.0 H452.0 Z" fill="#6aa50f"/><text x="474.0" y="328" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+10.000</text><text x="64" y="371" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">To holdmål, mens han er på banen</text><path d="M452.0 354.0 H468.0 Q472.0 354.0 472.0 358.0 V372.0 Q472.0 376.0 468.0 376.0 H452.0 Z" fill="#6aa50f"/><text x="484.0" y="372" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+20.000</text><text x="64" y="415" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Mål af en midtbanespiller</text><path d="M452.0 398.0 H598.0 Q602.0 398.0 602.0 402.0 V416.0 Q602.0 420.0 598.0 420.0 H452.0 Z" fill="#6aa50f"/><text x="614.0" y="416" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+150.000</text><text x="64" y="459" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Sejrsmål</text><path d="M452.0 442.0 H488.0 Q492.0 442.0 492.0 446.0 V460.0 Q492.0 464.0 488.0 464.0 H452.0 Z" fill="#6aa50f"/><text x="504.0" y="460" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+40.000</text><text x="64" y="503" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Et skud på mål mere</text><path d="M452.0 486.0 H458.0 Q462.0 486.0 462.0 490.0 V504.0 Q462.0 508.0 458.0 508.0 H452.0 Z" fill="#6aa50f"/><text x="474.0" y="504" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">+10.000</text><line x1="64" y1="524" x2="800" y2="524" stroke="#1f5240" stroke-width="1"/><text x="64" y="564" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start">I alt</text><path d="M452.0 546.0 H710.0 Q714.0 546.0 714.0 550.0 V566.0 Q714.0 570.0 710.0 570.0 H452.0 Z" fill="#6aa50f"/><text x="726.0" y="565" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">+262.000</text><rect x="852" y="200" width="364" height="170" rx="14" fill="#134d39"/><text x="880" y="238" font-size="18" fill="#8fb8a6" font-weight="400" text-anchor="start">Bruno Fernandes' pris stiger</text><text x="880" y="288" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">+262.000 kr.</text><text x="880" y="322" font-size="20" fill="#d1fae5" font-weight="400" text-anchor="start">Dit hold er 262.000 kr.</text><text x="880" y="348" font-size="20" fill="#d1fae5" font-weight="400" text-anchor="start">mere værd efter kampen.</text><rect x="852" y="392" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="431" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Kaptajn</text><text x="1000" y="431" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">tæller dobbelt</text><rect x="852" y="466" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="505" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Bank</text><text x="1000" y="505" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">1 % rente pr. runde</text><rect x="852" y="540" width="364" height="62" rx="12" fill="#134d39"/><text x="880" y="579" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Køb</text><text x="1000" y="579" font-size="21" fill="#d1fae5" font-weight="400" text-anchor="start">koster 1 % i gebyr</text>
</g></svg>
