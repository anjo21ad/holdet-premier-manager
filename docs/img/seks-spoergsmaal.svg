<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-label="Seks spørgsmål: Clarke til Neto holder i alle seks og anbefales. Clarke til Rudoni holder også, men Rudonis tal er 73 procent gæt.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="680" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="680" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">BESLUTNINGSREGLEN</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Seks spørgsmål før hver handel</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Svaret skal være ja alle seks gange. Ellers beholder du dit hold.</text><rect x="64" y="196" width="370" height="150" rx="14" fill="#134d39"/><circle cx="100" cy="234" r="18" fill="#1f5240"/><text x="100" y="241" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="132" y="241" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Er handlen god med</text><text x="132" y="269" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">modellens bedste bud?</text><text x="132" y="320" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="376" y="321" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+510</text><circle cx="402" cy="314" r="13" fill="#6aa50f"/><path d="M395 314 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="457" y="196" width="370" height="150" rx="14" fill="#134d39"/><circle cx="493" cy="234" r="18" fill="#1f5240"/><text x="493" y="241" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="525" y="241" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Også hvis forskellen på</text><text x="525" y="269" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">spillerne er 25 % mindre?</text><text x="525" y="320" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="769" y="321" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+355</text><circle cx="795" cy="314" r="13" fill="#6aa50f"/><path d="M788 314 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="850" y="196" width="370" height="150" rx="14" fill="#134d39"/><circle cx="886" cy="234" r="18" fill="#1f5240"/><text x="886" y="241" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="918" y="241" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Også hvis vi stoler mere</text><text x="918" y="269" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">på spillernes egne tal?</text><text x="918" y="320" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="1162" y="321" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+520</text><circle cx="1188" cy="314" r="13" fill="#6aa50f"/><path d="M1181 314 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="366" width="370" height="150" rx="14" fill="#134d39"/><circle cx="100" cy="404" r="18" fill="#1f5240"/><text x="100" y="411" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="132" y="411" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Også hvis vi stoler mere</text><text x="132" y="439" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">på det typiske for rollen?</text><text x="132" y="490" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="376" y="491" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+503</text><circle cx="402" cy="484" r="13" fill="#6aa50f"/><path d="M395 484 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="457" y="366" width="370" height="150" rx="14" fill="#134d39"/><circle cx="493" cy="404" r="18" fill="#1f5240"/><text x="493" y="411" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="525" y="411" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Også hvis den nye</text><text x="525" y="439" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">spiller mindre end ventet?</text><text x="525" y="490" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="769" y="491" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+407</text><circle cx="795" cy="484" r="13" fill="#6aa50f"/><path d="M788 484 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="850" y="366" width="370" height="150" rx="14" fill="#134d39"/><circle cx="886" cy="404" r="18" fill="#1f5240"/><text x="886" y="411" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="918" y="411" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">Også hvis den gamle</text><text x="918" y="439" font-size="21" fill="#ffffff" font-weight="400" text-anchor="start">spiller mere end ventet?</text><text x="918" y="490" font-size="17" fill="#8fb8a6" font-weight="400" text-anchor="start">Clarke → Neto</text><text x="1162" y="491" font-size="22" fill="#ffffff" font-weight="700" text-anchor="end">+451</text><circle cx="1188" cy="484" r="13" fill="#6aa50f"/><path d="M1181 484 l5 5 l9 -10" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="561" r="15" fill="#6aa50f"/><path d="M72 561 l6 6 l10 -12" fill="none" stroke="#072319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="568" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">Clarke → Neto: ja seks gange. Handlen anbefales.</text><circle cx="80" cy="611" r="15" fill="#f5a524"/><text x="80" y="618" font-size="21" fill="#072319" font-weight="800" text-anchor="middle">!</text><text x="108" y="618" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Clarke → Rudoni: også ja seks gange. Men 73 % af Rudonis tal er gæt,</text><text x="108" y="648" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">fordi han kun har startet fire kampe. Den kræver din egen vurdering.</text>
</g></svg>
