<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="Kalibrering: for spillere med under 5 kampes data var den første models hældning 0,34, denne models 0,96. Over 15 kampe: 1,16 mod 0,95.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b2c"/><stop offset="1" stop-color="#072319"/></linearGradient><clipPath id="k"><rect width="1280" height="570" rx="18"/></clipPath><marker id="pil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8a6"/></marker></defs>
<g clip-path="url(#k)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="570" fill="url(#bg)"/>
<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">VIRKER DET?</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Kan man stole på forskellene?</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">1,0 betyder: siger modellen, at A er 100.000 kr. bedre end B, så er han i gennemsnit også det.</text><rect x="64" y="196" width="18" height="18" rx="4" fill="#5b8def"/><text x="92" y="211" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">Første model (fem lag)</text><rect x="330" y="196" width="18" height="18" rx="4" fill="#6aa50f"/><text x="358" y="211" font-size="18" fill="#d1fae5" font-weight="400" text-anchor="start">Denne model</text><line x1="64.0" y1="240" x2="64.0" y2="470" stroke="#1f5240" stroke-width="1"/><text x="64" y="494" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="middle">0</text><line x1="824.0" y1="236" x2="824.0" y2="470" stroke="#d1fae5" stroke-width="2" stroke-opacity="0.8"/><text x="824" y="494" font-size="16" fill="#d1fae5" font-weight="400" text-anchor="middle">1,0 = præcis</text><text x="64" y="270" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Spillere med under 5 kampes data</text><path d="M64.0 286.0 H318.4 Q322.4 286.0 322.4 290.0 V312.0 Q322.4 316.0 318.4 316.0 H64.0 Z" fill="#5b8def"/><text x="334.40000000000003" y="309" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">0,34</text><text x="392.40000000000003" y="309" font-size="18" fill="#8fb8a6" font-weight="400" text-anchor="start">kun en tredjedel af forskellen var ægte</text><path d="M64.0 320.0 H789.6 Q793.6 320.0 793.6 324.0 V346.0 Q793.6 350.0 789.6 350.0 H64.0 Z" fill="#6aa50f"/><text x="781.6" y="342" font-size="20" fill="#072319" font-weight="700" text-anchor="end">0,96</text><text x="64" y="386" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Spillere med over 15 kampes data</text><path d="M64.0 402.0 H941.6 Q945.6 402.0 945.6 406.0 V428.0 Q945.6 432.0 941.6 432.0 H64.0 Z" fill="#5b8def"/><text x="957.5999999999999" y="425" font-size="20" fill="#ffffff" font-weight="400" text-anchor="start">1,16</text><path d="M64.0 436.0 H782.0 Q786.0 436.0 786.0 440.0 V462.0 Q786.0 466.0 782.0 466.0 H64.0 Z" fill="#6aa50f"/><text x="774.0" y="458" font-size="20" fill="#072319" font-weight="700" text-anchor="end">0,95</text><text x="64" y="536" font-size="19" fill="#8fb8a6" font-weight="400" text-anchor="start">Målt på 808 spiller-runder i runde 4 og 5 af Efterår 2026. Alle prognoser var skrevet ned før runderne.</text>
</g></svg>
