t-weight="400" text-anchor="end">helt almindelig</text><text x="64" y="530" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Den, der ser bedst ud efter få kampe, er oftest den, der har haft mest held.</text><text x="64" y="562" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">Og held følger ikke med, når du køber ham.</text>
