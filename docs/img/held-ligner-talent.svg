<text x="64" y="70" font-size="16" fill="#86efac" font-weight="600" text-anchor="start" letter-spacing="3">DEN STORE FÆLDE</text><text x="64" y="118" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start">Held ligner talent</text><text x="64" y="160" font-size="22" fill="#d1fae5" font-weight="400" text-anchor="start">24 spillere, der i virkeligheden er lige gode. Sådan ser deres point ud efter tre runder:</text><line x1="110" y1="470.0" x2="990" y2="470.0" stroke="#1f5240" stroke-width="1"/><text x="96" y="476.0" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="end">0</text><line x1="110" y1="354.1" x2="990" y2="354.1" stroke="#1f5240" stroke-width="1"/><text x="96" y="360.0909090909091" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="end">50</text><line x1="110" y1="238.2" x2="990" y2="238.2" stroke="#1f5240" stroke-width="1"/><text x="96" y="244.1818181818182" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="end">100</text><text x="96" y="197" font-size="16" fill="#8fb8a6" font-weight="400" text-anchor="start">Point pr. runde</text><line x1="110" y1="354.1" x2="990" y2="354.1" stroke="#d1fae5" stroke-width="2" stroke-opacity="0.75"/><text x="1006" y="350.0909090909091" font-size="19" fill="#d1fae5" font-weight="400" text-anchor="start">Det, de alle</text><text x="1006" y="374.0909090909091" font-size="19" fill="#d1fae5" font-weight="400" text-anchor="start">reelt er værd</text><circle cx="140.0" cy="381.9" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="175.7" cy="335.5" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="211.3" cy="423.6" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="247.0" cy="303.1" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="282.6" cy="365.7" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="318.3" cy="321.6" r="7" fill="#5f8f7c" stroke="#0d3b2c" stroke-width="2"/><circle cx="353.9" cy="405.1" r=